<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DrawingOps · brag composition</title>
<style>
  @font-face { font-family: "InterD"; src: url("fonts/InterDisplay-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "InterD"; src: url("fonts/InterDisplay-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterD"; src: url("fonts/InterDisplay-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "InterT"; src: url("fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "InterT"; src: url("fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "InterT"; src: url("fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Plex"; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2"); font-weight: 400; }
  @font-face { font-family: "Plex"; src: url("fonts/ibm-plex-mono-latin-600-normal.woff2"); font-weight: 600; }

  :root { --navy: #08121F; --navy2: #0D1B2A; --primary: #0B5FA5; --sky: #5AA7E8; --ice: #7DBAEE; --ink: #F3F6FA; --muted: #9FB3C8; }
  html, body { margin: 0; padding: 0; background: var(--navy); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: InterT, system-ui, sans-serif; color: var(--ink); perspective: 1800px; }
  .abs { position: absolute; will-change: transform, opacity; }

  /* stage: deep navy, a faint drafting grid, slow brand-blue glows */
  #bg { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 40%, #0F2236 0%, #0A1828 45%, #070F1A 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(40px); }
  #g1 { width: 1100px; height: 800px; background: radial-gradient(closest-side, rgba(11,95,165,.42), rgba(11,95,165,0)); }
  #g2 { width: 900px; height: 700px; background: radial-gradient(closest-side, rgba(90,167,232,.16), rgba(90,167,232,0)); }
  #grid { position: absolute; inset: -240px; opacity: .9;
    background-image: linear-gradient(rgba(125,186,238,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(125,186,238,.075) 1px, transparent 1px),
      linear-gradient(rgba(125,186,238,.032) 1px, transparent 1px), linear-gradient(90deg, rgba(125,186,238,.032) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    -webkit-mask-image: radial-gradient(1300px 900px at 50% 45%, #000 30%, transparent 85%); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(1500px 1000px at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); pointer-events: none; }
  #blueprint { position: absolute; left: 50%; top: 50%; width: 2300px; margin-left: -1150px; margin-top: -813px; filter: invert(1) hue-rotate(180deg) saturate(1.6) brightness(1.15); mix-blend-mode: screen;
    -webkit-mask-image: radial-gradient(900px 600px at 50% 50%, #000 0%, transparent 100%); }

  /* type */
  .eyebrow { font: 600 17px/1 Plex, monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--ice); display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .eyebrow .bar { width: 36px; height: 1.5px; background: linear-gradient(90deg, var(--sky), rgba(90,167,232,0)); }
  .title { font: 600 68px/1.05 InterD, sans-serif; letter-spacing: -.028em; color: var(--ink); }
  .title .line { white-space: nowrap; }
  .title .acc .w { background: linear-gradient(90deg, #A9D3F7, #5AA7E8); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
  .q { font: 600 70px/1.05 InterD, sans-serif; letter-spacing: -.03em; color: var(--ink); white-space: nowrap; }
  .q .qm { color: var(--sky); }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.055); border: 1px solid rgba(125,186,238,.28); font: 500 19px/1 InterT, sans-serif; color: #D7E6F5; white-space: nowrap; }
  .pill svg { color: var(--ice); flex: none; }
  .tag { font: 600 13px/1 Plex, monospace; letter-spacing: .14em; text-transform: uppercase; color: #F6D58E; background: rgba(32,24,8,.78); border: 1px solid rgba(245,198,107,.45); padding: 8px 12px; border-radius: 7px; white-space: nowrap; }

  /* real UI cards */
  .card { border-radius: 14px; overflow: hidden; background: #fff; transform-origin: 50% 40%;
    box-shadow: 0 50px 100px -24px rgba(0,0,0,.7), 0 14px 34px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.08); }
  .card img { display: block; }
  .card.paper { border-radius: 4px; }
  .card.phone { border-radius: 38px; padding: 12px; background: #111A24; box-shadow: 0 50px 100px -20px rgba(0,0,0,.75), inset 0 0 0 2px #2A3A4C, 0 0 0 1px rgba(255,255,255,.06); }
  .card.phone img { border-radius: 28px; }
  .band { position: absolute; left: 0; right: 0; overflow: hidden; }
  .ring { position: absolute; border: 3px solid var(--sky); border-radius: 10px; box-shadow: 0 0 0 5px rgba(90,167,232,.22), 0 0 26px rgba(90,167,232,.55); pointer-events: none; }
  .ring.warn { border-color: #F08A7E; box-shadow: 0 0 0 5px rgba(240,138,126,.22), 0 0 26px rgba(240,138,126,.5); }

  .tile { border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025)); border: 1px solid rgba(125,186,238,.18); box-shadow: 0 30px 70px -30px rgba(0,0,0,.6); overflow: hidden; }
  .tile .lbl { position: absolute; left: 22px; top: 18px; font: 600 14px/1 Plex, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--ice); }
  .tile .card { position: absolute; }

  .lock { display: flex; align-items: center; gap: 30px; }
  .lock img { width: 112px; height: 112px; border-radius: 22px; box-shadow: 0 20px 60px rgba(11,95,165,.55); }
  .word { font: 700 132px/1 InterD, sans-serif; letter-spacing: -.045em; color: #fff; }
  .tagline { font: 500 34px/1.3 InterD, sans-serif; letter-spacing: -.01em; color: #C5D5E6; text-align: center; white-space: nowrap; }
  .foot { font: 400 15px/1 Plex, monospace; letter-spacing: .12em; text-transform: uppercase; color: #6F86A0; white-space: nowrap; }

  #brand { display: flex; align-items: center; gap: 12px; font: 600 21px/1 InterT, sans-serif; color: #E8EEF6; letter-spacing: -.01em; }
  #brand img { width: 30px; height: 30px; border-radius: 7px; }
  #prog { position: absolute; left: 0; top: 0; height: 3px; background: linear-gradient(90deg, #0B5FA5, #7DBAEE); box-shadow: 0 0 12px rgba(90,167,232,.6); }

  #cursor { width: 34px; height: 34px; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); transform-origin: 6px 4px; }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid var(--sky); z-index: 49; pointer-events: none; }

  #subs { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; z-index: 60; }
  #subs .sub { font: 600 34px/1.3 InterT, sans-serif; color: #fff; text-align: center; padding: 12px 28px 14px; border-radius: 14px; white-space: pre-line;
    background: rgba(5,11,20,.78); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 12px 34px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="g1" class="glow"></div>
  <div id="g2" class="glow"></div>
  <img id="blueprint" src="../captures/drawing-m205-current.png" alt="">
  <div id="grid"></div>
  <div id="vignette"></div>
  <div id="prog"></div>
  <div id="subs"><div class="sub"></div></div>
</div>
<script src="icons.js"></script>
<script src="timeline.js"></script>
<script src="comp.js"></script>
</body>
</html>
