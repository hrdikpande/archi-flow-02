# T-05: build images and deploy staging from main. Inactive until the staging host exists
# (DEC-01): set repository variable STAGING_HOST and secrets STAGING_SSH_KEY, STAGING_ENV.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push images
        run: |
          tag=ghcr.io/${{ github.repository }}
          sha=${{ github.event.workflow_run.head_sha }}
          docker build -t $tag/web:$sha backend && docker push $tag/web:$sha
          docker build -t $tag/caddy:$sha -f deploy/caddy/Dockerfile . && docker push $tag/caddy:$sha
      - name: Deploy over SSH (backup, migrate, restart)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 600 /dev/null key && printf '%s' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new deploy@$HOST \
            "cd /srv/drawingops && ./deploy.sh ${{ github.event.workflow_run.head_sha }}"
