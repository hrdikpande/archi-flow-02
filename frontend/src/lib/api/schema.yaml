openapi: 3.0.3
info:
  title: DrawingOps API
  version: 1.0.0
  description: Drawing and deliverable control. See docs/02 §12.
paths:
  /api/v1/allocations:
    get:
      operationId: allocations_list
      description: 'F-17 planned hours: list (people the viewer sees) and set for
        weeks in one action.'
      parameters:
      - in: query
        name: project
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
      - in: query
        name: week
        schema:
          type: string
      tags:
      - allocations
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Allocation'
          description: ''
    put:
      operationId: allocations_update
      description: 'F-17 planned hours: list (people the viewer sees) and set for
        weeks in one action.'
      tags:
      - allocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllocationSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllocationSetRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Allocation'
          description: ''
