components:
  schemas:
    ActionEnum:
      enum:
      - respond
      - close
      - reject
      - reopen
      type: string
      description: |-
        * `respond` - respond
        * `close` - close
        * `reject` - reject
        * `reopen` - reopen
    ActivityItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        type:
          type: string
        verb:
          type: string
        actor:
          type: string
        text:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        entity_label:
          type: string
        link:
          type: string
        discipline:
          type: string
          format: uuid
          nullable: true
      required:
      - actor
      - at
      - discipline
      - entity_id
      - entity_label
      - entity_type
      - id
      - link
      - text
      - type
      - verb
    Allocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        project_code:
          type: string
          readOnly: true
        stage:
          type: string
          format: uuid
          readOnly: true
        stage_name:
          type: string
          readOnly: true
        week:
          type: string
          format: date
          readOnly: true
          description: Monday of the ISO week.
        planned_h:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          readOnly: true
      required:
      - id
      - planned_h
      - project
      - project_code
      - stage
      - stage_name
      - user
      - week
    AllocationSetRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
        stage:
          type: string
          format: uuid
        weeks:
          type: array
          items:
            type: string
            format: date
          maxItems: 52
          minItems: 1
        hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
      required:
      - hours
      - project
      - stage
      - user
      - weeks
    AllowedAction:
      type: object
      properties:
        action:
          type: string
        label:
          type: string
        primary:
          type: boolean
        needs_reason:
          type: boolean
        hint:
          type: string
        blocked_reason:
          type: string
          nullable: true
      required:
      - action
      - blocked_reason
      - hint
      - label
      - needs_reason
      - primary
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        key_id:
          type: string
          readOnly: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_usable:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - is_usable
