# Development and CI stack (docs/02 §2, §14). `make up` from the repository root.
name: drawingops

x-django: &django
  build:
    context: ../backend
    target: prod
  env_file: ../.env
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
    seaweedfs: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drawingops}
      POSTGRES_USER: ${POSTGRES_USER:-drawingops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawingops}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    env_file: ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes: [objects:/data]
    ports: ["127.0.0.1:8333:8333"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  migrate:
    <<: *django
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_bucket"]

  web:
    <<: *django
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${WEB_WORKERS:-2}", "--threads", "4", "--access-logfile", "-"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
      interval: 5s
      retries: 20

  worker:
    <<: *django
    command: ["celery", "-A", "config", "worker", "-Q", "default,email,sweeps,pdf", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *django
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      web: { condition: service_healthy }

  # `make test-backend`: pytest with the real system libraries (WeasyPrint, Tesseract).
  tests:
    profiles: ["test"]
    build:
      context: ../backend
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://drawingops:drawingops@postgres:5432/drawingops
    volumes: ["../backend:/app"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  objects:
