groups:
  - name: drawingops
    rules:
      - alert: AppDown
        expr: up{job="drawingops-web"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "DrawingOps web is not answering /metrics" }
      - alert: HighErrorRate
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(django_http_responses_total_by_status_total[5m])), 1) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of requests fail with 5xx" }
      - alert: SlowLists
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket[10m]))) > 0.3
        for: 15m
        labels: { severity: warn }
        annotations: { summary: "p95 latency above 300 ms (N-01)" }
      - alert: SchedulerStale
        expr: drawingops_beat_heartbeat_age_seconds > 300 or drawingops_beat_heartbeat_age_seconds < 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Celery beat has not run for 5 minutes" }
      - alert: SweepMissing
        expr: max(drawingops_sweeps_missing) > 0
        labels: { severity: page }
        annotations: { summary: "A daily automation sweep did not run by 09:00 (N-05)" }
      - alert: OutboxBacklog
        expr: drawingops_outbox_pending > 500
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Outbox events are piling up; is the worker running?" }
