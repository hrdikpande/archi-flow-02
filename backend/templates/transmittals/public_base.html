<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Drawings{% endblock %}</title>
<style>
  :root { --bg:#F7F8FA; --surface:#FFFFFF; --muted:#556172; --text:#16202C; --border:#D9DEE5; --primary:#0B5FA5; --late:#A61B1B; --late-bg:#FDE7E7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F141A; --surface:#151B23; --muted:#9AA6B5; --text:#E6EAF0; --border:#2E3742; --primary:#5AA7E8; --late:#F59A9A; --late-bg:#3D1A1A; } }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/20px Inter, system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; }
  h1 { font-size:24px; line-height:32px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; white-space:nowrap; }
  table { width:100%; border-collapse:collapse; margin-top:16px; }
  th { text-align:left; font-size:12px; color:var(--muted); padding:8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .site-search input { flex:1; min-height:44px; font:inherit; padding:0 12px; border:1px solid #c9d1dc; border-radius:4px; }
  .site-search .btn { min-height:44px; }
  .site-list { list-style:none; margin:16px 0 0; padding:0; border-top:1px solid #e3e6ea; }
  .site-row { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:44px; padding:12px 4px; border-bottom:1px solid #e3e6ea; color:inherit; text-decoration:none; }
  .site-row:focus-visible { outline:2px solid #2B7FFF; outline-offset:2px; }
  .site-dl { font-size:22px; color:var(--primary); min-width:44px; text-align:center; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .ack { margin:16px 0 0; padding:12px; border:1px solid #c9d1dc; border-radius:8px; }
  .ack-ask { border-color:var(--primary); border-width:2px; }
  button.btn { border:0; cursor:pointer; font:inherit; }
  button.btn:focus-visible { outline:2px solid #2B7FFF; outline-offset:2px; }
  a.btn, button.btn { display:inline-block; padding:8px 14px; border-radius:4px; background:var(--primary); color:#fff; text-decoration:none; font-weight:600; min-height:24px; }
  a.link { color:var(--primary); }
  a.btn:focus-visible, a.link:focus-visible { outline:2px solid #2B7FFF; outline-offset:2px; }
  .superseded { color:var(--late); background:var(--late-bg); padding:2px 6px; border-radius:4px; font-size:12px; font-weight:600; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
