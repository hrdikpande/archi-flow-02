<style>

html, body { width: 1920px; height: 1080px; overflow: hidden; background: #eef1f5; font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

/* feature rail */
.rail { position: absolute; left: 96px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }

.bul li { display: flex; gap: 14px; font-size: 24px; line-height: 1.32; color: #26313f; }

.vp { position: relative; width: 1220px; height: 686px; overflow: hidden; background: #f7f8fa; }

.eyebrow { font: 600 18px "IBM Plex Mono", monospace; letter-spacing: .18em; color: var(--sky); }
.card { position: absolute; width: 600px; border-radius: 16px; background: #fff; color: var(--ink); padding: 26px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.card .num { font: 600 30px "IBM Plex Mono", monospace; }
.card .ttl { font-size: 24px; margin-top: 4px; color: #26313f; }

window.TOTAL = TOTAL;

let MAN = {};

const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };

}

const STATE_SEQ = [["planned", "Planned", "circle-dashed"], ["in_progress", "In progress", "pencil"], ["ready_for_check", "Ready for check", "send"], ["in_check", "In check", "search-check"], ["approved_for_issue", "Approved for issue", "badge-check"], ["issued", "Issued · C01", "send-horizontal"]];

function build() {
  for (const s of SCENES) {
    let d;
    if (s.type === "feature") {
      d = el(`<div class="scene"><div class="rail"><div class="chap">CHAPTER ${String(s.chap).padStart(2, "0")} / ${NCH}</div><div class="phase">${PH[s.ph]}</div><h1>${s.title}</h1><ul class="bul">${s.bul.map((b) => `<li>${ICON("check", 24)}<span>${b}</span></li>`).join("")}</ul>${s.roles ? `<div class="roles">${s.roles.map((r) => `<span>${r}</span>`).join("")}</div>` : ""}</div>

        ${s.phone ? `<div class="phone"><img src="../shots/${s.phone[0]}.png"><div class="lbl">${s.phone[2]}</div></div>` : ""}</div>`);
    } else if (s.type === "hook") {
      d = el(`<div class="scene dark"><div style="position:absolute;left:150px;top:300px">
        <div class="big l1">Every sheet.</div><div class="big l2">Every revision.</div><div class="big l3">Every deadline.</div>
        <div class="l4" style="margin-top:34px;font-size:44px;font-weight:600;color:var(--sky)">In one live register.</div></div>
        <div class="card c3" style="left:1180px;top:230px;opacity:.0"><div class="num">E-102</div><div class="ttl">Power Layout · First Floor</div></div>
        <div class="card c2" style="left:1150px;top:300px;opacity:.0"><div class="num">M-205</div><div class="ttl">OT Ductwork Level 2</div></div>
        <div class="card c1" style="left:1110px;top:380px"><div class="num">A-101</div><div class="ttl">Ground Floor Plan</div><div class="meta">2026-014 HSR Block B · Architecture · Stage 4 GFC</div><div class="row"><span class="st"></span><span class="pill rev">P02</span></div></div></div>`);
    } else if (s.type === "reveal") {
      d = el(`<div class="scene dark"><div style="position:absolute;left:0;right:0;top:250px;text-align:center">
        <img class="logo" src="logo.svg" style="width:132px;height:132px;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.4)">
        <div class="wm" style="margin-top:34px;font-size:112px;font-weight:600;letter-spacing:-.035em">DrawingOps</div>
        <div class="tg" style="margin-top:18px;font-size:36px;color:#dbe6f2">Drawing and deliverable control for architecture and MEP firms</div>
        <div class="sb" style="margin-top:16px;font-size:26px;color:#93a9c2">On top of the AutoCAD and Revit your teams already use</div></div></div>`);
    } else if (s.type === "outcome") {
      d = el(`<div class="scene dark"><div style="position:absolute;left:150px;right:150px;top:270px">
        <div class="eyebrow e">WHAT IT CHANGES</div>
        <div class="q1" style="margin-top:28px;font-size:60px;line-height:1.16;font-weight:600;letter-spacing:-.02em;max-width:1500px">The owner sees which sheets are late, who is overloaded and what is waiting for review, without a single phone call.</div>
        <div class="q2" style="margin-top:36px;font-size:44px;font-weight:600;color:var(--sky)">And site never builds from a superseded drawing.</div></div></div>`);
    } else if (s.type === "roadmap") {
      const P = [["PHASE 0", "Discovery", "3 weeks", "Interviews, process map, baseline metrics, pilot projects", "Gate G0"], ["PHASE 1", "Visibility", "12 weeks + 4-week pilot", "Register, reviews, transmittals, workload, alerts, dashboards", "Gate G1"], ["PHASE 2", "Flow and billing", "about 10 weeks", "Review queue, client comments, billing signal, CAD plugins, site view", "Gate G2"], ["PHASE 3", "Construction", "about 10 weeks", "RFIs, submittals, site reports, change orders, clashes, knowledge", ""], ["PHASE 4", "Intelligence", "after 6 months of clean data", "Late-risk and workload forecasts, AI drawing checks", "Gate G3 first"]];
      d = el(`<div class="scene"><div style="position:absolute;left:96px;top:150px"><div class="chap">HOW IT GETS BUILT</div><h1 style="margin-top:14px;font-size:60px;font-weight:600;letter-spacing:-.02em">Delivered in gated phases</h1></div>
        ${P.map((p, i) => `<div class="phasecard pc${i}" style="left:${96 + i * 350}px"><div class="p">${p[0]}</div><h3>${p[1]}</h3><div class="dur">${p[2]}</div><p class="what">${p[3]}</p>${p[4] ? `<div class="gate">${p[4]}</div>` : ""}</div>`).join("")}
        <div class="oos" style="position:absolute;left:96px;top:850px;font-size:21px;color:#556172">Out of scope by design: drawing authoring, and invoicing, GST and ledger (they stay in your accounting tool).</div></div>`);
    } else if (s.type === "outro") {
      d = el(`<div class="scene dark"><div style="position:absolute;left:0;right:0;top:280px;text-align:center">
        <img class="logo" src="logo.svg" style="width:104px;height:104px;border-radius:22px">
        <div class="wm" style="margin-top:26px;font-size:92px;font-weight:600;letter-spacing:-.035em">DrawingOps</div>
        <div class="tg" style="margin-top:20px;font-size:34px;color:#dbe6f2">Every screen in this video is a working, clickable demo.</div>
        <div class="by mono" style="margin-top:40px;font-size:20px;letter-spacing:.16em;color:#93a9c2">BUILT BY LATENTIQ</div></div></div>`);
    }
    s.el = d; root.appendChild(d);
  }
  const tr = document.querySelector("#prog .track"); for (let i = 0; i < NCH; i++) tr.appendChild(document.createElement("b"));
}

const fadeIn = (e, lt, t0, dy = 18, d = .55) => { const k = eo((lt - t0) / d); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * dy}px)`; };

function camAt(s, lt) {
  const ks = s.cam; let a = ks[0], b = ks[0];
  for (let i = 0; i < ks.length; i++) { if (ks[i][0] <= lt) { a = ks[i]; b = ks[i + 1] || ks[i]; } }
  if (lt < ks[0][0]) b = a;
  const span = Math.max(.001, b[0] - a[0]);
  // move during the first 1.1s of each segment (or the whole segment when shorter)
  const k = b === a ? 0 : eio((lt - a[0]) / Math.min(1.1, span));
  const toC = (r) => { const z = clamp(Math.min(1440 / r[2], 810 / r[3]), 1, 1.9); return [r[0] + r[2] / 2, r[1] + r[3] / 2, z]; };
  const A = toC(a[1]), B = toC(b[1]);
  return [lerp(A[0], B[0], k), lerp(A[1], B[1], k), Math.exp(lerp(Math.log(A[2]), Math.log(B[2]), k))];
}

function renderFeature(s, lt) {
  const d = s.el; const out = clamp((s.dur - lt) / .45);
  // rail
  fadeIn(d.querySelector(".chap"), lt, .05); fadeIn(d.querySelector(".phase"), lt, .12);
  fadeIn(d.querySelector("h1"), lt, .18, 24);
  const lis = d.querySelectorAll(".bul li"); const n = lis.length;
  const gap = n > 1 ? Math.min(1.6, (s.dur - 3.4) / (n - 1)) : 0;
  lis.forEach((li, i) => fadeIn(li, lt, .75 + i * gap, 14, .5));
  const roles = d.querySelector(".roles"); if (roles) [...roles.children].forEach((c, i) => fadeIn(c, lt, 1.0 + i * .12, 10, .4));
  d.querySelector(".rail").style.opacity = out;
  // window
  const win = d.querySelector(".win"); const k = eo(lt / .6);
  win.style.opacity = k * out; win.style.transform = `translateY(${(1 - k) * 30 - (1 - out) * 10}px) scale(${.985 + .015 * k})`;
  // shots crossfade
  let curName = s.shots[0][0];
  const imgs = d.querySelectorAll(".cam img");
  s.shots.forEach(([nm, t], i) => { const next = s.shots[i + 1]; let o = clamp((lt - t) / .3); if (i === 0) o = 1; if (next && lt >= next[0] + .3) o = 0; imgs[i].style.opacity = o; imgs[i].style.zIndex = i; if (lt >= t) curName = nm; });
  d.querySelector(".u").textContent = `DrawingOps · ${TITLE[curName] || curName}`;
  // camera
  const [cx, cy, z] = camAt(s, lt); const base = 1220 / 1440; const sc = base * z;
  let tx = 610 - cx * sc, ty = 343 - cy * sc;
  tx = clamp(tx, 1220 - 1440 * sc, 0); ty = clamp(ty, 686 - 810 * sc, 0);
  d.querySelector(".cam").style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
  // ring
  const ring = d.querySelector(".ring"); ring.style.opacity = 0;
  for (const [a, b, ref] of s.ring || []) { if (lt >= a - .3 && lt <= b + .3) { const r = rectOf(ref); if (!r) continue; const o = clamp((lt - a) / .3) * clamp((b - lt) / .3 + 1); ring.style.opacity = Math.min(1, o); const p = 6; Object.assign(ring.style, { left: r[0] - p + "px", top: r[1] - p + "px", width: r[2] + 2 * p + "px", height: r[3] + 2 * p + "px", borderWidth: 3 / sc + "px", borderRadius: 10 / sc + "px" }); } }
  // cursor
  const cur = d.querySelector(".cursor"), rip = d.querySelector(".ripple"); cur.style.opacity = 0; rip.style.opacity = 0;
  const ev = s.cur || [];
  if (ev.length) {
    const first = ev[0][0], last = ev[ev.length - 1][0];
    let pos, vis = 0;
    if (lt < first - 1.0 || lt > last + 1.0) vis = 0;
    else {
      vis = clamp((lt - (first - 1.0)) / .3) * clamp((last + 1.0 - lt) / .3);
      let i = ev.findIndex((e) => e[0] > lt);
      if (i === -1) pos = ptOf(ev[ev.length - 1][1]);
      else if (i === 0) { const p = ptOf(ev[0][1]); const k2 = eio((lt - (first - 1.0)) / .8); pos = [p[0] + 160 * (1 - k2), p[1] + 110 * (1 - k2)]; }
      else { const p0 = ptOf(ev[i - 1][1]), p1 = ptOf(ev[i][1]); const mv = Math.min(.75, ev[i][0] - ev[i - 1][0] - .15); const k2 = eio((lt - (ev[i][0] - mv)) / mv); pos = [lerp(p0[0], p1[0], k2), lerp(p0[1], p1[1], k2)]; }
      let press = 1;
      for (const [t, ref, click] of ev) { if (!click) continue; const dt = lt - t; if (dt >= 0 && dt < .55) { const p = ptOf(ref); rip.style.opacity = .9 * (1 - dt / .55); rip.style.left = p[0] + "px"; rip.style.top = p[1] + "px"; rip.style.transform = `scale(${(.4 + dt / .55 * 1.2) / sc})`; } if (Math.abs(dt) < .1) press = .86; }
      cur.style.opacity = vis; cur.style.transform = `translate(${pos[0] - 3 / sc}px,${pos[1] - 2 / sc}px) scale(${press / sc})`;
    }
  }
  // phone
  const ph = d.querySelector(".phone");
  if (ph) { const k3 = eo((lt - s.phone[1]) / .6); ph.style.opacity = k3 * out; ph.style.transform = `translateY(${(1 - k3) * 80}px) rotate(${(1 - k3) * 4}deg)`; }
}

function renderHook(s, lt) {
  const d = s.el;
  fadeIn(d.querySelector(".l1"), lt, .25, 30); fadeIn(d.querySelector(".l2"), lt, .85, 30); fadeIn(d.querySelector(".l3"), lt, 1.45, 30); fadeIn(d.querySelector(".l4"), lt, 3.0, 20);
  const c1 = d.querySelector(".c1"), c2 = d.querySelector(".c2"), c3 = d.querySelector(".c3");
  const k = eo((lt - .4) / .8); c1.style.opacity = k; c1.style.transform = `translateY(${(1 - k) * 60}px)`;
  const k2 = eo((lt - .7) / .8); c2.style.opacity = .55 * k2; c2.style.transform = `translateY(${(1 - k2) * 60}px) scale(.94)`;
  const k3 = eo((lt - 1.0) / .8); c3.style.opacity = .3 * k3; c3.style.transform = `translateY(${(1 - k3) * 60}px) scale(.88)`;
  // state cycles on the beat (0.5 s) from 1.0 s, lands on Issued
  const idx = clamp(Math.floor((lt - 1.0) / .5), 0, STATE_SEQ.length - 1);
  const st = d.querySelector(".st"); if (st.dataset.i != idx) { st.innerHTML = chipHtml(STATE_SEQ[idx]); st.dataset.i = idx; }
  const pop = 1 + .08 * Math.max(0, 1 - ((lt - 1.0) % .5) / .2) * (lt > 1 && lt < 4.1 ? 1 : 0);
  st.style.display = "inline-block"; st.style.transform = `scale(${pop})`; st.style.transformOrigin = "left center";
  d.querySelector(".rev").textContent = idx === STATE_SEQ.length - 1 ? "P02 → superseded" : "P02";
  const out = clamp((s.dur - lt) / .45); d.firstChild.style.opacity = out; [c1, c2, c3].forEach((c) => c.style.opacity *= out);
}
function renderTitle(s, lt) {
  const d = s.el; const out = clamp((s.dur - lt) / .45); d.style.opacity = out;
  const q = (c) => d.querySelector(c);
  if (s.type === "reveal") { const k = eo((lt - .1) / .7); q(".logo").style.opacity = k; q(".logo").style.transform = `scale(${.7 + .3 * k})`; fadeIn(q(".wm"), lt, .45, 24); fadeIn(q(".tg"), lt, 1.1); fadeIn(q(".sb"), lt, 1.8); }
  if (s.type === "outcome") { fadeIn(q(".e"), lt, .1); fadeIn(q(".q1"), lt, .35, 24, .7); fadeIn(q(".q2"), lt, 3.6, 20, .6); }
  if (s.type === "outro") { const k = eo((lt - .1) / .7); q(".logo").style.opacity = k; q(".logo").style.transform = `scale(${.7 + .3 * k})`; fadeIn(q(".wm"), lt, .35, 24); fadeIn(q(".tg"), lt, 1.0); fadeIn(q(".by"), lt, 1.8); d.style.opacity = 1; }
  if (s.type === "roadmap") { fadeIn(d.firstChild, lt, .05); for (let i = 0; i < 5; i++) fadeIn(q(`.pc${i}`), lt, .5 + i * .45, 36, .6); fadeIn(q(".oos"), lt, 3.2); }
}

function render(t) {
  let bgDark = 0;
  for (const s of SCENES) {
    const lt = t - s.start; const on = lt >= 0 && lt < s.dur;
    s.el.classList.toggle("on", on);
    if (!on) continue;
    if (s.type === "feature") renderFeature(s, lt); else if (s.type === "hook") renderHook(s, lt); else renderTitle(s, lt);
  }
  // background: dark for title scenes, light for the rest, blended across 0.5 s at each boundary
  const isDark = (s) => s && ["hook", "reveal", "outcome", "outro"].includes(s.type);
  for (let i = 0; i < SCENES.length; i++) { const s = SCENES[i]; if (t >= s.start && t < s.start + s.dur) { const prev = SCENES[i - 1], here = isDark(s) ? 1 : 0; const p = prev ? (isDark(prev) ? 1 : 0) : here; const k = eio((t - s.start) / .5); bgDark = lerp(p, here, k); } }
  if (t >= TOTAL) bgDark = 1;
  document.getElementById("bg-dark").style.opacity = bgDark;
  // progress bar
  const cs = SCENES.find((s) => t >= s.start && t < s.start + s.dur);
  const prog = document.getElementById("prog");
  if (cs && cs.type === "feature") {
    prog.style.opacity = Math.min(eo((t - cs.start) / .5), clamp((cs.start + cs.dur - t) / .45));
    [...prog.querySelectorAll(".track b")].forEach((b, i) => { b.className = i + 1 < cs.chap ? "done" : i + 1 === cs.chap ? "cur" : ""; });
    document.getElementById("prog-l").textContent = `${String(cs.chap).padStart(2, "0")} · ${cs.title}`;
  } else prog.style.opacity = 0;
}
window.render = render;

window.ready = (async () => {
  try { MAN = await (await fetch("../manifest.json")).json(); } catch (e) { MAN = window.MANIFEST || {}; }
  build();
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  render(0);
  return TOTAL;
})();
</script>
